<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'DejaVu Sans','Segoe UI',Helvetica,Arial,sans-serif">
  <!-- self-contained background so it reads on light or dark GitHub -->
  <rect x="0" y="0" width="880" height="560" rx="10" fill="#f7f9fb"/>
  <rect x="0.5" y="0.5" width="879" height="559" rx="10" fill="none" stroke="#d3dde4"/>

  <text x="30" y="40" font-size="22" font-weight="700" fill="#16202b">Pico Password Vault — wiring</text>
  <text x="30" y="62" font-size="13" fill="#5b6b7b">MicroPython edition · B10K potentiometer + push-button · SSD1306 128×32</text>

  <!-- ============================= PICO ============================= -->
  <rect x="610" y="96" width="220" height="410" rx="12" fill="#1f6f4a" stroke="#124d33" stroke-width="2"/>
  <rect x="686" y="80" width="68" height="20" rx="4" fill="#b9a46b"/>
  <text x="720" y="94" font-size="10" fill="#5b6b7b" text-anchor="middle">USB-C</text>
  <text x="720" y="392" font-size="15" font-weight="700" fill="#eaf3ee" text-anchor="middle">Raspberry Pi Pico</text>
  <text x="720" y="410" font-size="10" fill="#bfe0cd" text-anchor="middle">RP2040 · top view</text>

  <!-- left-edge pins (signal + one GND) -->
  <rect x="598" y="120" width="16" height="10" rx="2" fill="#2f6fe0"/>
  <text x="626" y="129" font-size="11" fill="#eaf3ee">1 · GP0 — SDA</text>
  <rect x="598" y="146" width="16" height="10" rx="2" fill="#b8791a"/>
  <text x="626" y="155" font-size="11" fill="#eaf3ee">2 · GP1 — SCL</text>
  <rect x="598" y="172" width="16" height="10" rx="2" fill="#4a4a45"/>
  <text x="626" y="181" font-size="11" fill="#eaf3ee">3 · GND</text>
  <rect x="598" y="220" width="16" height="10" rx="2" fill="#8e44ad"/>
  <text x="626" y="229" font-size="11" fill="#eaf3ee">6 · GP4 — button</text>
  <rect x="598" y="264" width="16" height="10" rx="2" fill="#1a7f4b"/>
  <text x="626" y="273" font-size="11" fill="#eaf3ee">31 · GP26 — ADC0</text>
  <rect x="598" y="308" width="16" height="10" rx="2" fill="#cf4436"/>
  <text x="626" y="317" font-size="11" fill="#eaf3ee">36 · 3V3(OUT)</text>

  <!-- ============================= RAILS ============================= -->
  <!-- 3V3 rail -->
  <rect x="430" y="300" width="8" height="150" rx="3" fill="#cf4436"/>
  <text x="434" y="466" font-size="10" fill="#cf4436" text-anchor="middle" font-weight="600">3V3</text>
  <!-- GND rail -->
  <rect x="470" y="150" width="8" height="330" rx="3" fill="#4a4a45"/>
  <text x="474" y="496" font-size="10" fill="#4a4a45" text-anchor="middle" font-weight="600">GND</text>

  <!-- ============================= OLED ============================= -->
  <rect x="60" y="96" width="190" height="92" rx="8" fill="#1b2a47" stroke="#0f1b30" stroke-width="2"/>
  <rect x="76" y="108" width="150" height="38" rx="2" fill="#0b1212"/>
  <text x="86" y="123" font-size="9" fill="#8fe6ff">Password Vault</text>
  <text x="86" y="137" font-size="9" fill="#8fe6ff">&gt; GitHub</text>
  <text x="60" y="178" font-size="11" fill="#d6e2f5">OLED SSD1306 128×32 · 0x3C</text>
  <text x="60" y="90" font-size="10" fill="#5b6b7b">SoftI²C @ 100 kHz on GP0/GP1</text>
  <rect x="66" y="188" width="14" height="9" rx="2" fill="#2f6fe0"/><text x="73" y="212" font-size="9" fill="#16202b" text-anchor="middle">SDA</text>
  <rect x="110" y="188" width="14" height="9" rx="2" fill="#b8791a"/><text x="117" y="212" font-size="9" fill="#16202b" text-anchor="middle">SCL</text>
  <rect x="154" y="188" width="14" height="9" rx="2" fill="#4a4a45"/><text x="161" y="212" font-size="9" fill="#16202b" text-anchor="middle">GND</text>
  <rect x="198" y="188" width="14" height="9" rx="2" fill="#cf4436"/><text x="205" y="212" font-size="9" fill="#16202b" text-anchor="middle">VCC</text>

  <!-- ============================= POT ============================= -->
  <circle cx="130" cy="300" r="40" fill="#e9edf1" stroke="#b6c0c9" stroke-width="2"/>
  <circle cx="130" cy="300" r="6" fill="#5b6b7b"/>
  <line x1="130" y1="300" x2="130" y2="268" stroke="#5b6b7b" stroke-width="4" stroke-linecap="round"/>
  <text x="130" y="356" font-size="12" font-weight="600" fill="#16202b" text-anchor="middle">B10K pot (linear)</text>
  <rect x="94" y="342" width="14" height="9" rx="2" fill="#cf4436"/><text x="101" y="366" font-size="9" fill="#16202b" text-anchor="middle">3V3</text>
  <rect x="123" y="342" width="14" height="9" rx="2" fill="#1a7f4b"/><text x="130" y="388" font-size="9" fill="#16202b" text-anchor="middle">wiper</text>
  <rect x="152" y="342" width="14" height="9" rx="2" fill="#4a4a45"/><text x="159" y="366" font-size="9" fill="#16202b" text-anchor="middle">GND</text>

  <!-- ============================= BUTTON ============================= -->
  <rect x="86" y="430" width="90" height="58" rx="8" fill="#e9edf1" stroke="#b6c0c9" stroke-width="2"/>
  <circle cx="131" cy="452" r="13" fill="#cfd7de" stroke="#9aa7b2" stroke-width="2"/>
  <text x="131" y="500" font-size="12" font-weight="600" fill="#16202b" text-anchor="middle">push-button</text>
  <rect x="98" y="468" width="14" height="9" rx="2" fill="#8e44ad"/>
  <rect x="150" y="468" width="14" height="9" rx="2" fill="#4a4a45"/>

  <!-- ============================= SIGNAL WIRES ============================= -->
  <!-- OLED SDA -> GP0 -->
  <path d="M73,197 C73,240 560,150 598,125" fill="none" stroke="#2f6fe0" stroke-width="3.5" stroke-linecap="round"/>
  <!-- OLED SCL -> GP1 -->
  <path d="M117,197 C117,255 560,178 598,151" fill="none" stroke="#b8791a" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Pot wiper -> GP26 -->
  <path d="M130,351 C130,300 300,269 598,269" fill="none" stroke="#1a7f4b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Button -> GP4 -->
  <path d="M105,468 C105,330 560,250 598,225" fill="none" stroke="#8e44ad" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ============================= POWER: to rails ============================= -->
  <!-- 3V3 pin -> 3V3 rail -->
  <path d="M598,313 C520,320 470,320 438,320" fill="none" stroke="#cf4436" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="434" cy="320" r="4" fill="#cf4436"/>
  <!-- 3V3 rail -> OLED VCC -->
  <path d="M430,335 C300,340 205,260 205,197" fill="none" stroke="#cf4436" stroke-width="3" stroke-linecap="round"/>
  <circle cx="430" cy="335" r="3.5" fill="#cf4436"/>
  <!-- 3V3 rail -> pot 3V3 -->
  <path d="M430,430 C260,430 101,400 101,351" fill="none" stroke="#cf4436" stroke-width="3" stroke-linecap="round"/>
  <circle cx="430" cy="430" r="3.5" fill="#cf4436"/>

  <!-- GND pin(3) -> GND rail -->
  <path d="M598,177 C540,180 500,175 474,168" fill="none" stroke="#4a4a45" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="474" cy="165" r="4" fill="#4a4a45"/>
  <!-- GND rail -> OLED GND -->
  <path d="M470,205 C300,210 161,250 161,197" fill="none" stroke="#4a4a45" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="205" r="3.5" fill="#4a4a45"/>
  <!-- GND rail -> pot GND -->
  <path d="M470,360 C300,360 159,392 159,351" fill="none" stroke="#4a4a45" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="360" r="3.5" fill="#4a4a45"/>
  <!-- GND rail -> button GND -->
  <path d="M470,455 C300,455 157,468 157,477" fill="none" stroke="#4a4a45" stroke-width="3" stroke-linecap="round"/>
  <circle cx="470" cy="455" r="3.5" fill="#4a4a45"/>

  <!-- ============================= LEGEND ============================= -->
  <g font-size="11" fill="#16202b">
    <rect x="250" y="524" width="12" height="8" rx="2" fill="#2f6fe0"/><text x="268" y="532">SDA</text>
    <rect x="308" y="524" width="12" height="8" rx="2" fill="#b8791a"/><text x="326" y="532">SCL</text>
    <rect x="366" y="524" width="12" height="8" rx="2" fill="#1a7f4b"/><text x="384" y="532">pot wiper (ADC0)</text>
    <rect x="500" y="524" width="12" height="8" rx="2" fill="#8e44ad"/><text x="518" y="532">button</text>
    <rect x="574" y="524" width="12" height="8" rx="2" fill="#cf4436"/><text x="592" y="532">3V3 rail</text>
    <rect x="648" y="524" width="12" height="8" rx="2" fill="#4a4a45"/><text x="666" y="532">GND rail</text>
  </g>
</svg>
